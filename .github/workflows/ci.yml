name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # --locked fails the build if uv.lock is out of sync with pyproject.toml,
        # mirroring Railway's `uv sync --locked`. Prevents the lockfile drift that
        # froze production deploys (see #71).
        run: uv sync --locked

      # Tests are the hard gate: they must stay green.
      - name: pytest
        run: uv run pytest -q

      # ruff and mypy run even if a prior step failed, so their status is always
      # visible. They currently report pre-existing debt (~70 ruff + ~86 mypy);
      # the cleanup effort turns them green, after which they protect against
      # regressions.
      - name: ruff
        if: always()
        run: uv run ruff check

      - name: mypy
        if: always()
        run: uv run mypy

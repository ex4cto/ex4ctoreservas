[project]
name = "garay-tours"
version = "0.1.0"
description = "Sistema unificado de tiquetera, comprobantes y conciliacion para Garay Tours"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-telegram-bot[job-queue]>=21.0",
    "psycopg2-binary>=2.9.12",
    "rapidfuzz>=3.0",
    "anthropic>=0.120.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.22",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic genera env.py y plantillas con su propio estilo; no las lintar.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N818 exige el sufijo "Error" en excepciones (convencion inglesa). Nuestro dominio usa
# lenguaje ubicuo en espanol, donde se lee "ErrorDeDominio" / "MontoInvalido".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# HTML inside f-string — reformatting would corrupt the invoice; adding noqa inside the
# string literal would inject literal text into the HTML output.
"src/garay/aplicacion/factura/servicio.py" = ["E501"]
# Message catalog: string values are user-facing text that cannot be split across lines.
# RUF001: ➕ is an intentional emoji symbol in user-facing text, not an accidental + substitute.
"src/garay/mensajes/catalogo.py" = ["E501", "RUF001"]
# SQLAlchemy filter expressions use == False / == True / == None intentionally to generate
# IS FALSE / IS TRUE / IS NULL SQL; ruff E712/E711 cannot distinguish this from Python bugs.
"src/garay/infraestructura/persistencia/repositorios/*.py" = ["E711", "E712"]
# FastAPI Depends() in route signatures is intentional and required by the framework.
"src/garay/infraestructura/webhook/rutas.py" = ["B008"]
# ➕ is an intentional emoji in button labels, not an accidental + substitute.
"src/garay/infraestructura/telegram/handlers_tours.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# openpyxl no publica stubs de tipos; se usa solo en el adaptador de importacion offline.
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
asyncio_mode = "auto"

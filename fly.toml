app = "garay-tours"
primary_region = "gru"

[build]

[processes]
  web    = "sh scripts/start_webhook.sh"
  worker = "uv run python -m garay.infraestructura.telegram.main"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["web"]

[[vm]]
  size    = "shared-cpu-1x"
  memory  = "512mb"
  processes = ["web"]

[[vm]]
  size    = "shared-cpu-1x"
  memory  = "512mb"
  processes = ["worker"]
